# Build + deploy the static export to GitHub Pages (project site:
# BachiDev/weather → https://bachidev.github.io/weather).
# GITHUB_PAGES=true activates `basePath: "/weather"` in next.config.ts so
# `/_next/*` assets resolve under the project subpath. Local dev is unaffected.
name: Deploy to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Kept in sync with ci.yml (jsdom 30 needs Node 22+).
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build with Next.js
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
